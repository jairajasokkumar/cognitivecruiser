<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toyota Motor Europe - Holiday Calendar</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <div class="header-left">
                <div class="logo">TOYOTA</div>
                <div class="header-title">
                    <h1>Holiday Calendar</h1>
                    <p>Toyota Motor Europe Team</p>
                </div>
            </div>
            <div class="sync-status">
                <div class="sync-dot"></div>
                <span>Synced with Box</span>
            </div>
        </div>

        <!-- Filter Section -->
        <div class="filter-section">
            <span class="filter-label">Filter by Team Member:</span>
            <select class="filter-select" id="teamFilter" onchange="filterByTeamMember()">
                <option value="all">All Team Members</option>
                <option value="Alexander Joossens">Alexander Joossens (Data & AI Engineer)</option>
                <option value="Alvaro Pena">Alvaro Pena (Data Engineer)</option>
                <option value="Edwin Brinza">Edwin Brinza (Business Transformation Consultant)</option>
                <option value="Iulia Caravasile">Iulia Caravasile</option>
                <option value="Jairaj Kumar">Jairaj Kumar (Solution Architect)</option>
                <option value="Monica Besleaga">Monica Besleaga (Solution Architect)</option>
            </select>
            <span class="user-badge" id="currentUserBadge">👤 Logged in as: Alexander Joossens</span>
        </div>

        <!-- Controls -->
        <div class="controls">
            <div class="nav-controls">
                <button class="btn btn-secondary" onclick="previousMonth()">
                    ◀ Previous
                </button>
                <div class="current-month" id="currentMonth"></div>
                <button class="btn btn-secondary" onclick="nextMonth()">
                    Next ▶
                </button>
            </div>
            <div class="action-buttons">
                <button class="btn btn-secondary" onclick="goToToday()">
                    📅 Today
                </button>
                <button class="btn btn-primary" onclick="openAddModal()">
                    ➕ Add Holiday
                </button>
                <button class="btn btn-secondary" onclick="exportCalendar()">
                    📥 Export
                </button>
            </div>
        </div>

        <!-- Calendar -->
        <div class="calendar-section">
            <div class="calendar-grid" id="calendar"></div>
        </div>

        <!-- Stats -->
        <div class="stats-section">
            <div class="stat-card">
                <div class="stat-label">Total Holidays This Month</div>
                <div class="stat-value" id="totalHolidays">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Team Members on Leave</div>
                <div class="stat-value" id="teamMembers">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Days Until Next Holiday</div>
                <div class="stat-value" id="nextHoliday">-</div>
            </div>
        </div>
    </div>

    <!-- Add Holiday Modal -->
    <div class="modal" id="addModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Add Holiday</h2>
                <button class="close-btn" onclick="closeModal()">&times;</button>
            </div>
            <form onsubmit="addHoliday(event)">
                <div class="form-group">
                    <label>Team Member</label>
                    <select id="personName" required>
                        <option value="">Select team member</option>
                        <option value="Alexander Joossens">Alexander Joossens (Data & AI Engineer)</option>
                        <option value="Alvaro Pena">Alvaro Pena (Data Engineer)</option>
                        <option value="Edwin Brinza">Edwin Brinza (Business Transformation Consultant)</option>
                        <option value="Iulia Caravasile">Iulia Caravasile</option>
                        <option value="Jairaj Kumar">Jairaj Kumar (Solution Architect)</option>
                        <option value="Monica Besleaga">Monica Besleaga (Solution Architect)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Start Date</label>
                    <input type="date" id="startDate" required>
                </div>
                <div class="form-group">
                    <label>End Date</label>
                    <input type="date" id="endDate" required>
                </div>
                <div class="form-group">
                    <label>Holiday Type</label>
                    <select id="holidayType" required>
                        <option value="Annual Leave">Annual Leave</option>
                        <option value="Sick Leave">Sick Leave</option>
                        <option value="Personal Day">Personal Day</option>
                        <option value="Public Holiday">Public Holiday</option>
                    </select>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancel</button>
                    <button type="submit" class="btn btn-primary">Add Holiday</button>
                </div>
            </form>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
